name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    needs: image
    permissions:
      contents: read
    uses: codefly-dev/core/.github/workflows/go-service-ci.yml@main

  # Socket fixtures pin the readiness protocol; only a real server proves redis
  # agrees with it. This job runs both backends with real credentials, and
  # REDIS_INFRA_TESTS=required turns a missing backend into a failure so the job
  # cannot pass by skipping.
  infrastructure:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # setup-go's cache corrupts the downloaded toolchain module on restore, so
      # the shared go-service-ci workflow disables it too.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Readiness against real redis
        env:
          REDIS_INFRA_TESTS: required
        run: go test -run TestRealRedis -count=1 -v -timeout 30m ./...

  image:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          driver-opts: image=moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Build runtime image
        run: docker buildx build --load --build-arg SOURCE_DATE_EPOCH=0 --tag service-redis:test .

      - name: Smoke test runtime image
        shell: bash
        run: |
          set -euo pipefail

          container_name=service-redis-smoke
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT

          docker run --detach --name "$container_name" service-redis:test >/dev/null

          ready=false
          for _ in $(seq 1 60); do
            state=$(docker inspect --format '{{.State.Status}}' "$container_name")
            if docker exec "$container_name" redis-cli ping 2>/dev/null | grep -q PONG; then
              ready=true
              break
            fi
            if [[ "$state" != running ]]; then
              break
            fi
            sleep 1
          done

          if [[ "$ready" != true ]]; then
            docker logs "$container_name"
            exit 1
          fi

          docker exec "$container_name" redis-cli set smoke ok >/dev/null
          test "$(docker exec "$container_name" redis-cli get smoke)" = ok

      - name: Scan runtime image
        run: |
          docker save --output /tmp/service-redis-image.tar service-redis:test
          mkdir -p /tmp/trivy-cache
          docker run --rm \
            --volume /tmp/trivy-cache:/root/.cache/trivy \
            --volume /tmp/service-redis-image.tar:/image.tar:ro \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --quiet --format table --severity HIGH,CRITICAL \
            --exit-code 1 --input /image.tar

      # CI has no registry push credentials, so it verifies that the pinned
      # inputs reproduce the committed digest instead of publishing; the
      # multi-arch image is pushed to Docker Hub out-of-band from these same
      # inputs.
      - name: Verify runtime image digest is reproducible
        shell: bash
        run: |
          set -euo pipefail
          expected=$(jq -er '.digest' runtime-image.json)
          docker buildx build --no-cache \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --platform linux/amd64,linux/arm64 \
            --provenance=false --sbom=false \
            --output type=oci,dest=/tmp/runtime-oci.tar,rewrite-timestamp=true \
            --metadata-file /tmp/runtime-meta.json \
            .
          built=$(jq -er '."containerimage.digest"' /tmp/runtime-meta.json)
          if [[ "$built" != "$expected" ]]; then
            echo "built digest $built does not match runtime-image.json $expected" >&2
            exit 1
          fi

      # Anonymous consumers (composition CI) pull the pinned runtime image
      # without a registry login. A pin bumped in the repo but never pushed to
      # the public registry reproduces cleanly above yet 401/404s for everyone
      # else, and nothing here pulls it — so the gap stays green until a
      # downstream bump trips over it. Fail loud instead.
      - name: Verify runtime image is publicly pullable
        shell: bash
        env:
          DOCKER_CONFIG: /tmp/anon-docker-config
        run: |
          set -euo pipefail
          ref=$(jq -er '.name + "@" + .digest' runtime-image.json)
          mkdir -p "$DOCKER_CONFIG"
          echo '{}' > "$DOCKER_CONFIG/config.json"
          if ! docker manifest inspect "$ref" >/dev/null; then
            echo "pinned runtime image $ref is not anonymously pullable" >&2
            echo "publish it to the public registry before pinning the digest" >&2
            exit 1
          fi
