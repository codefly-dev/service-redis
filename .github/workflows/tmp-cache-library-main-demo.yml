# TEMPORARY, removed before merge: GitHub only dispatches or schedules a
# workflow that exists on the default branch, so this runs the same script the
# scheduled workflow (cache-library-main.yml) runs, on this pull request, twice:
# against go/cache main (expected green) and against go/cache v0.4.0 at
# 215c795 — the commit before the interface-cache#20 fix, which still compiles
# against cache/v0.3.0 — expected RED, to show the run catching a behavioural
# divergence on a GitHub runner, not only passing.
name: tmp cache-library-main demonstration
on:
  pull_request:
    paths: ['.github/workflows/tmp-cache-library-main-demo.yml']
permissions:
  contents: read
jobs:
  behave:
    name: demo on go/cache ${{ matrix.ref }} (${{ matrix.expect }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ref: main, expect: expected green }
          - { ref: 215c7954f84a305616dd91886ef9713769f9afec, expect: expected red }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - run: .github/scripts/cache-library-main.sh "${{ matrix.ref }}"
